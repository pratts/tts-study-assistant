name: Extension package

# Builds an installable zip of the Chrome extension whenever a change to
# extension/ reaches main (a merged PR is a push to main). Can also be run by
# hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ["extension/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-package-${{ github.ref }}
  cancel-in-progress: false # let every merge produce its package

jobs:
  package:
    name: Zip extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5

      - name: Read version from manifest.json
        id: meta
        run: |
          version=$(jq -er '.version' manifest.json)
          # Chrome accepts 1–4 dot-separated integers (0–65535 each).
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "::error file=extension/manifest.json::Invalid version \"$version\"" && exit 1
          fi
          name="tts-study-assistant-extension-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Packaging version $version"

      - name: Create zip
        env:
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          # manifest.json must sit at the zip root (Chrome Web Store layout).
          # Development-only files are left out.
          zip -r -X "../${NAME}.zip" . \
            -x 'tests/*' 'package.json' 'package-lock.json' 'README.md' \
               'node_modules/*' '*.DS_Store' '.*'
          unzip -l "../${NAME}.zip"
          unzip -p "../${NAME}.zip" manifest.json | jq -e '.manifest_version == 3' > /dev/null

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: ${{ steps.meta.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NAME: ${{ steps.meta.outputs.name }}
        run: |
          {
            echo "### Extension package"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- File: \`${NAME}.zip\` (download it from this run's Artifacts)"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
