name: Frontend CI

# Lint, typecheck, unit tests, stale API types and a production build.
# Runs on every PR so the required "Frontend CI passed" check always
# reports; the work itself is skipped when frontend/ is untouched.
# E2E (Playwright) is not run here: it needs a real backend (see
# frontend/README.md).
on:
  pull_request:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  changes:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
      - id: filter
        name: Diff against base
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^1 HEAD | grep -qE '^(frontend/|\.github/workflows/frontend-ci\.yml$)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "No frontend changes: lint, typecheck, tests and build skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are up to date
        # Types come from backend/openapi.json; regenerate with `npm run api:types`.
        run: npm run api:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        env:
          VITE_API_BASE_URL: https://tts-study-assistant-production.up.railway.app/api/v1
        run: npm run build

  # Single status required on main. Skipped jobs (no frontend changes) count
  # as passing; failed or cancelled ones, including change detection, fail.
  ci-passed:
    name: Frontend CI passed
    runs-on: ubuntu-latest
    needs: [changes, check]
    if: always()
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check job results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more frontend checks failed"; exit 1
          fi
