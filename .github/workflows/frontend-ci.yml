name: Frontend CI

# Lint, typecheck, unit tests, stale API types and a production build.
# Runs only when frontend code changes. E2E (Playwright) is not run here:
# it needs a real backend (see frontend/README.md).
on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types are up to date
        # Types come from backend/openapi.json; regenerate with `npm run api:types`.
        run: npm run api:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Build
        env:
          VITE_API_BASE_URL: https://tts-study-assistant-production.up.railway.app/api/v1
        run: npm run build
