name: Extension release

# Publishes the Chrome extension when a maintainer pushes a version tag:
#
#   git tag -s extension-v0.2.1 -m "Extension v0.2.1"
#   git push origin extension-v0.2.1
#
# Checks that the tag matches extension/manifest.json at the tagged commit and
# that the commit is on main, then attaches
# tts-study-assistant-extension-v<version>.zip to a GitHub Release whose notes
# list only extension/ changes since the previous extension-v* tag.
# Merging to main releases nothing.
on:
  push:
    tags: ["extension-v*"]

# Write access applies only to this workflow's token: it creates the release
# for the pushed tag. Other workflows stay read-only.
permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # main and all tags, for the checks and the notes

      - name: Check tag, version and branch
        id: meta
        run: |
          version="${TAG#extension-v}"
          # Chrome's version rules (1-4 integers, 0-65535, no leading zeros).
          if ! .github/scripts/extension-version-check.sh "$version" 0 > /dev/null; then
            echo "::error::Tag $TAG does not contain a valid Chrome version" && exit 1
          fi
          manifest=$(jq -er '.version' extension/manifest.json)
          if [[ "$manifest" != "$version" ]]; then
            echo "::error file=extension/manifest.json::Tag $TAG does not match manifest.json version $manifest at this commit. Delete the tag, bump the manifest (or fix the tag) and tag again."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to ${GITHUB_SHA::7}, which is not on main. Tag a commit that has been merged to main."
            exit 1
          fi
          exists=false
          if gh release view "$TAG" > /dev/null 2>&1; then
            exists=true
            echo "::notice::Release $TAG already exists; nothing to do."
          fi
          {
            echo "version=$version"
            echo "archive=tts-study-assistant-extension-v${version}.zip"
            echo "exists=$exists"
          } >> "$GITHUB_OUTPUT"

      - name: Write release notes
        if: steps.meta.outputs.exists == 'false'
        run: |
          .github/scripts/extension-release-notes.sh "$TAG" release-notes.md
          cat release-notes.md

      - name: Create zip
        if: steps.meta.outputs.exists == 'false'
        working-directory: extension
        env:
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          # Info-ZIP reads the ZIP and ZIPOPT environment variables as extra
          # options, which once turned the archive name into an input file.
          unset ZIP ZIPOPT
          # manifest.json at the zip root (Chrome Web Store layout);
          # development-only files are left out.
          zip -r -X "../${ARCHIVE}" . \
            -x 'tests/*' 'package.json' 'package-lock.json' 'README.md' \
               'node_modules/*' '*.DS_Store' '.*'
          unzip -l "../${ARCHIVE}"
          unzip -p "../${ARCHIVE}" manifest.json | jq -e '.manifest_version == 3' > /dev/null

      - name: Create release
        if: steps.meta.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE" \
            --verify-tag \
            --title "Extension v${VERSION}" \
            --notes-file release-notes.md

      - name: Summary
        env:
          EXISTS: ${{ steps.meta.outputs.exists }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
        run: |
          {
            echo "### Extension release ${TAG}"
            echo ""
            if [[ "$EXISTS" == "true" ]]; then
              echo "The release already existed; nothing was changed."
            else
              echo "Created release \`${TAG}\` with \`${ARCHIVE}\` from \`${GITHUB_SHA::7}\`."
            fi
            echo ""
            echo "[Releases](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases)"
          } >> "$GITHUB_STEP_SUMMARY"
