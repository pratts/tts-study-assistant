name: Extension version check

# Every PR that changes the shipped extension must bump "version" in
# extension/manifest.json above main's version and the latest extension-v*
# release. The Chrome Web Store only accepts higher versions; releases are
# published when a maintainer pushes the matching extension-v<version> tag
# (extension-release.yml).
on:
  pull_request:
    # Development-only files don't ship, so changing them needs no bump.
    paths:
      - "extension/**"
      - "!extension/tests/**"
      - "!extension/README.md"
      - "!extension/package.json"

permissions:
  contents: read

concurrency:
  group: extension-version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Extension version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # base branch and release tags

      - name: Compare versions
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          new=$(jq -er '.version' extension/manifest.json)
          base=$(git show "origin/${BASE_REF}:extension/manifest.json" | jq -er '.version')
          released=$(git tag -l 'extension-v*' --sort=-v:refname | head -n 1 | sed 's/^extension-v//')
          echo "PR: $new | ${BASE_REF}: $base | latest release: ${released:-none}"
          .github/scripts/extension-version-check.sh "$new" "$base" "$released"
